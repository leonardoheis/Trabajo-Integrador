[project]
name = "doc-classifier-backend"
version = "0.1.0"
description = "Pipeline de clasificación de documentos municipales — Municipalidad de Rosario"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "python-docx>=1.1",
    "Pillow>=10.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "aiofiles>=24.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # TestClient async de FastAPI
    "respx>=0.21",          # mock de requests HTTP
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aiofiles",
    "types-Pillow",
]

# ──────────────────────────────────────────────────────────────
# Ruff — linter + formatter (reemplaza flake8, isort, pyupgrade)
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints)
    "S",    # flake8-bandit (security)
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN101",   # self no necesita anotación
    "ANN102",   # cls no necesita anotación
    "ANN204",   # __init__ return None implícito
    "S101",     # assert permitido en tests
    "B008",     # Depends() de FastAPI en parámetros de función
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",      # no exigir type hints en tests
    "S",        # security checks relajados en tests
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "config", "document_ai", "models", "storage"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────
# mypy — verificación estática de tipos
# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

# ──────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=100",
]
markers = [
    "unit: tests unitarios sin I/O externo",
    "integration: tests que requieren Azure o filesystem",
    "slow: tests lentos (>1s)",
]

# ──────────────────────────────────────────────────────────────
# coverage
# ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "**/__init__.py",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "types-aiofiles>=25.1.0.20260508",
]
