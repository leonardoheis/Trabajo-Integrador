repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(README|models/)
      - id: end-of-file-fixer
        exclude: ^models/
      - id: check-yaml
      - id: debug-statements


  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy src
        pass_filenames: false
        files: ^src/
      - id: frontend-lint
        name: frontend eslint
        language: system
        entry: bash -c 'cd src/classiflow/frontend && npm run lint'
        pass_filenames: false
        files: ^src/classiflow/frontend/.*\.(ts|tsx)$
      - id: frontend-format
        name: frontend prettier check
        language: system
        entry: bash -c 'cd src/classiflow/frontend && npx prettier --check src'
        pass_filenames: false
        files: ^src/classiflow/frontend/.*\.(ts|tsx|css)$

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
      - id: pre-commit-update
        stages: [manual]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        stages: [pre-commit]
        exclude: ^(src/classiflow/playground/|documents/|\.claude/|models/)
