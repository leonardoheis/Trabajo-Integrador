[project]
name = "classiflow"
version = "0.1.0"
description = "classiflow allows to classify documents using agent-based approaches."
requires-python = ">=3.10"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "dependency-injector>=4.41",
    "pydantic-settings>=2.0",
    # Auth
    "authlib>=1.3",
    "PyJWT>=2.8",
    "httpx>=0.27",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Pipeline / agents
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "loguru>=0.7",
    "filetype>=1.2",
    "lingua-language-detector>=2.0",
    "chardet>=5.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",
    "pyyaml>=6.0",
    "llama-cpp-python>=0.2",
    "markitdown[pdf]>=0.1",
    "pymupdf>=1.24",
    "easyocr>=1.7.0",
    "torch>=2.7.1",
    # Not used directly -- pulled in transitively by easyocr (torchvision.transforms).
    "torchvision>=0.22.1",
    # Knowledge base / chat (stage 5)
    "chromadb>=0.5",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "transformers>=4.44",
    # Observability -- Weave is W&B's current LLM-tracing product and the only one of
    # their LangChain integrations that works with langchain>=0.3 (wandb's own
    # WandbTracer imports langchain.callbacks.tracers, a path removed in 0.3, and
    # langchain_community's WandbCallbackHandler is deprecated and needs pandas).
    # Traces still land in a W&B account -- wandb is declared explicitly rather than
    # relying on weave's optional [wandb] extra.
    "weave>=0.51",
    "wandb>=0.17",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "mypy",
    "pre-commit",
    "httpx>=0.28.1",
    "uv==0.8.9",
    "poethepoet==0.37.0",
    "joblib-stubs==1.5.0.1.20250510",
    "types-PyYAML>=6.0",
    "ipykernel>=7.3.0",
]
lint = [
    "pre-commit==4.3.0",
    "pre-commit-uv==4.1.4",
]
versioning = [
    "python-semantic-release==10.3.1",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classiflow"]
exclude = ["src/classiflow/frontend"]

#########################
# RUFF
#########################

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]
exclude = [
    ".claude",
    "tasks",
    "alembic",
    "models",
    # Excludes the JS/TS toolchain subdirs (React source, npm's dependency tree, build
    # output), not the whole frontend/ folder -- runner.py there is real Python and
    # should get the same checks as everything else in src/.
    "src/classiflow/frontend/node_modules",
    "src/classiflow/frontend/dist",
    "src/classiflow/frontend/src",
]

fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint]
extend-select = ["ALL"]

ignore = [
    "D",        # pydocstyle
    "N",        # variable names
    "CPY",      # copyright notices
    "S101",
    "ISC001",
    "ANN401",
    "COM812",
    "ASYNC119", # false positive: standard FastAPI async generator dependency pattern
    "S105",     # "bearer" is an OAuth2 spec string, not a hardcoded secret
    "EM101",    # field name strings in @dataclass exceptions are not message literals
]

[tool.ruff.lint.pylint]
# Mirrors [tool.pylint.design] max-args below -- FastAPI's Depends()-per-dependency
# style, and PipelineService's own growing set of injected collaborators (job_repo,
# document_steps_repo, enriched_record_repo, broadcaster, coordinator,
# enrichment_coordinator, document_storage, classification_coordinator, job_semaphore,
# indexer, document_kb_repo), mean DI-composing functions/classes legitimately grow one
# param per wired collaborator.
max-args = 11
# Mirrors [tool.pylint.design] max-public-methods below -- _Settings (settings.py)
# gets one read-only property per config field by design; each new Settings.* value
# legitimately adds one property, not unrelated behavior accumulating on one class.
max-public-methods = 34

[tool.ruff.format]
# Set Ruff to imitate Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"src/classiflow/playground/*.ipynb" = ["T201", "F401"]  # playground: print() is intentional output
"src/classiflow/playground/**/*.ipynb" = ["T201", "F401"]
"tests/**/*.py" = [
    "PLR6301", # pytest class methods don't need to use self
    "PLR0914", # test fixtures wiring many nodes/repos legitimately need more locals
]
# Scoped to this one file (not the project-wide `ignore` list above) so any other
# subprocess call added elsewhere in the codebase still gets flagged and reviewed on
# its own merits. This file's only call resolves the executable via shutil.which,
# never passes shell=True, and only ever runs a fixed, hardcoded argument list --
# nothing here is untrusted input.
"src/classiflow/frontend/runner.py" = ["S404", "S603"]

#########################
# MyPy
#########################

[tool.mypy]
strict = true
follow_imports = "normal"
python_version = "3.10"
mypy_path = ["src"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = [
    "src/classiflow/playground/",
    # JS/TS toolchain subdirs only -- not the whole frontend/ folder, since runner.py
    # there is real Python and should get the same checks as everything else in src/.
    "src/classiflow/frontend/(node_modules|dist|src)/",
]

disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true

ignore_missing_imports = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true

warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["google.*", "filetype", "llama_cpp", "faiss", "sentence_transformers", "markitdown", "pymupdf", "easyocr", "chromadb", "chromadb.*", "scipy.*", "sklearn.*", "transformers"]
ignore_missing_imports = true

#########################
# Codespell
#########################

[tool.codespell]
skip = "src/classiflow/playground"

#########################
# Bandit
#########################

[tool.bandit]
skips = ["B101"]

#########################
# Pylint
#########################

[tool.pylint.main]
extension-pkg-whitelist = ["mypy", "dependency_injector"]
fail-on = ["I"]
fail-under = 10
ignore = []
ignore-paths = []
jobs = 0
limit-inference-results = 1000
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.docparams",
    "pylint.extensions.dunder",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
    "pylint_pydantic",
]
py-version = "3.10"
suggestion-mode = true

[tool.pylint.basic]
argument-naming-style = "snake_case"
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
attr-naming-style = "snake_case"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]

class-attribute-naming-style = "any"
class-attribute-rgx = "([A-Za-z_][A-Za-z0-9_]{2,30}|(__.*__))$"
class-const-naming-style = "UPPER_CASE"
class-naming-style = "PascalCase"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
const-naming-style = "UPPER_CASE"
const-rgx = "(([A-Z_][A-Z0-9_]*)|(__.*__))$"
docstring-min-length = -1
function-naming-style = "snake_case"
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
good-names = ["i", "j", "k", "ex", "Run", "_"]
include-naming-hint = true

inlinevar-naming-style = "any"
inlinevar-rgx = "[A-Za-z_][A-Za-z0-9_]*$"
method-naming-style = "snake_case"
method-rgx = "[a-z_][a-z0-9_]{2,30}$"
module-naming-style = "snake_case"
module-rgx = "(([a-z_][a-z0-9_]*)|([A-Z][a-zA-Z0-9]+))$"
no-docstring-rgx = "^_"
property-classes = ["abc.abstractproperty"]
variable-naming-style = "snake_case"
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]
valid-classmethod-first-arg = ["cls"]
valid-metaclass-classmethod-first-arg = ["mcs"]

[tool.pylint.deprecated_builtins]
bad-functions = ["map", "filter"]

[tool.pylint.design]
max-args = 11
max-attributes = 7
max-bool-expr = 5
max-branches = 12
max-complexity = 10
max-locals = 15
max-parents = 7
# _Settings gets one read-only property per config field (slm_max_tokens, slm_n_ctx,
# ...) by design -- each new Settings.* field legitimately adds one, this isn't
# accumulating unrelated behavior on one class.
max-public-methods = 34
max-returns = 6
max-statements = 50

[tool.pylint.exceptions]
overgeneral-exceptions = ["'builtins.Exception'"]

[tool.pylint.format]
indent-after-paren = 4
indent-string = "    "
max-line-length = 120
max-module-lines = 400


[tool.pylint.imports]
deprecated-modules = ["regsub", "TERMIOS", "Bastion", "rexec"]
known-third-party = ["enchant"]


[tool.pylint.logging]
logging-format-style = "old"

logging-modules = ["logging"]

[tool.pylint."messages control"]
confidence = [
    "HIGH",
    "CONTROL_FLOW",
    "INFERENCE",
    "INFERENCE_FAILURE",
    "UNDEFINED",
]

disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]

enable = [
    "bad-inline-option",
    "file-ignored",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "deprecated-pragma",
    "file-ignored",
    "subprocess-run-check",
    "redefined-outer-name",
    "consider-using-assignment-expr",         # Too new syntax
    "unused-import",                          # Check and fix by Ruff
    "unused-variable",                        # Too many false positives
    "invalid-name",                           # Too many false positives
    "not-an-iterable",                        # Too many false positives
    "assignment-from-no-return",              # Too many false positives
    "magic-value-comparison",
    "consider-using-namedtuple-or-dataclass",
]

#########################
# Semantic Release
#########################

[tool.semantic_release.branches.main]
match = "*"

[tool.semantic_release]
commit_message = "chore(release): bump version and update changelog"
version_source = "tag"
version_variables = ["src/classiflow/__init__.py:__version__"]
version_toml = [
    "pyproject.toml:project.version:nf",
]
allow_zero_version = true

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore*", "Merge*"]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["chore", "feat", "fix"]
minor_tags = ["feat"]
patch_tags = ["fix"]

#########################
# Pytest
#########################

[tool.pytest.ini_options]
addopts = [
    "-r=A",
    "--doctest-modules",
    "-vvv",
]
testpaths = ["tests"]
pythonpath = ["."]
anyio_mode = "auto"

[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check ." }
fmt = "ruff format ."
typecheck = "mypy src"
test = "pytest tests"
coverage = { shell = "pytest tests -v --override-ini=addopts= --log-level=CRITICAL --cov=. --cov-branch --cov-report=xml --cov-report=html --cov-report=term-missing:skip-covered --junitxml=tests/reports/pytest-report.xml" }
check = ["lint", "typecheck", "coverage", "precommit-reloaded"]
serve = "python -m classiflow"
serve-api = { shell = "uvicorn classiflow.api.app:create_app --factory --reload --port 8000" }
serve-ui = { shell = "npm run dev", cwd = "src/classiflow/frontend" }
precommit = "uv run pre-commit run --all-files --verbose"
precommit-reloaded = "uv run --all-groups pre-commit run --all-files"
precommit-update = "uv run pre-commit run --hook-stage manual pre-commit-update"
