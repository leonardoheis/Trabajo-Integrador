allowed_mime_types:
  - application/pdf
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - image/jpeg
  - image/png
  - image/tiff

allowed_extensions:
  - .pdf
  - .docx
  - .jpg
  - .jpeg
  - .png
  - .tiff

# Explicitly rejected — never accepted regardless of magic bytes
disabled_mime_types:
  - text/html
  - application/xhtml+xml

disabled_extensions:
  - .html
  - .htm

# Maps each allowed MIME to its expected extensions — mismatches are gray zone
mime_to_extensions:
  application/pdf:
    - .pdf
  application/vnd.openxmlformats-officedocument.wordprocessingml.document:
    - .docx
  image/jpeg:
    - .jpg
    - .jpeg
  image/png:
    - .png
  image/tiff:
    - .tiff

max_file_size_mb: 50
